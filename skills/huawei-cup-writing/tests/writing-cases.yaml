schema_version: 1
status: SPECIFICATION_ONLY

cases:
  - id: normal_prose_polish
    class: normal
    task: polish_paragraph
    rules: [PROSE-001, PROSE-003, PROSE-004]
    required_outcomes: [clear_main_clause, evidence_kept]

  - id: normal_chinese_information_density
    class: normal
    task: split_english_style_compressed_sentence
    rules: [PROSE-003, PROSE-004]
    required_outcomes: [one_primary_judgment_per_sentence, logical_sentence_sequence]

  - id: normal_voice_naturalization
    class: normal
    task: naturalize_unnecessary_passive_voice
    rules: [PROSE-003, PROSE-006]
    input_text: '该方法被用来优化锚链质量。'
    undesirable_patterns: ['被用来']
    required_outcomes: [active_or_zero_subject_voice, meaning_preserved]

  - id: normal_abstract_rewrite
    class: normal
    task: rewrite_abstract
    rules: [ABS-001, ABS-002, ABS-003]
    required_outcomes: [question_method_result_mapping, body_numbers_only]

  - id: normal_result_deepening
    class: normal
    task: deepen_result_discussion
    rules: [DEPTH-002, FIG-005, CLAIM-002]
    required_outcomes: [phenomenon, quantitative_evidence, explanation, task_meaning]

  - id: normal_model_tailoring
    class: normal
    task: map_problem_features_to_model_relations
    rules: [DEPTH-001]
    required_outcomes: [problem_feature, model_element, reason_for_fit]

  - id: normal_cross_question_linkage
    class: normal
    task: explain_actual_cross_question_dependency
    rules: [STRUCT-001, DEPTH-001]
    required_outcomes: [upstream_output, downstream_use, no_false_linkage]

  - id: normal_parameter_provenance
    class: normal
    task: document_key_parameter_provenance
    rules: [DEPTH-001, NUM-001]
    required_outcomes: [value, unit, source_or_derivation, model_role]

  - id: normal_equation_context
    class: normal
    task: place_equation_in_model_context
    rules: [DEPTH-001]
    required_outcomes: [equation_purpose, symbol_meaning, output_meaning]

  - id: normal_evidence_based_model_evaluation
    class: normal
    task: calibrate_model_evaluation
    rules: [PROSE-002, CLAIM-002]
    required_outcomes: [design, evaluation_target, evidence, bounded_claim]

  - id: normal_bounded_limitation_and_alignment
    class: normal
    task: align_limitation_with_future_improvement
    rules: [ADW-002, DEPTH-005, CLAIM-001]
    required_outcomes: [observed_limitation, impact, matched_improvement, scope]

  - id: normal_concrete_generalization
    class: normal
    task: state_concrete_generalization_boundary
    rules: [CLAIM-001, ADW-003]
    required_outcomes: [applicable_object, conditions, validation_level, non_generalizable_scope]

  - id: normal_worklog_to_argument
    class: normal
    task: replace_worklog_narrative
    rules: [AI-001, STRUCT-001]
    required_outcomes: [final_reasoning_chain]

  - id: normal_defensive_to_positive_scope
    class: normal
    task: transform_defensive_scope
    rules: [ADW-001, ADW-003, ADW-006]
    required_outcomes: [positive_scope, claim_first]

  - id: normal_review_language_isolation
    class: normal
    task: separate_review_diagnosis_from_final_prose
    rules: [ADW-001, ADW-003, PROSE-001]
    input_text: '现有证据不足以支持该模型适用于所有城市。'
    undesirable_patterns: ['现有证据不足以支持']
    required_outcomes: [positive_scope, evidence_boundary_kept, no_review_metadiscourse]

  - id: normal_mechanical_label_chain_rewrite
    class: normal
    task: replace_compressed_label_chain_with_real_interface
    rules: [AI-005, PROSE-003, STRUCT-001]
    input_text: '本文构建了“候选点评价—布局优化—扰动分析”的研究框架。'
    undesirable_patterns: ['构建了“候选点评价—布局优化—扰动分析”的研究框架']
    required_outcomes: [explicit_input_output_relation, no_mechanical_label_chain]

  - id: normal_agent_meta_prose
    class: normal
    task: remove_answer_organization_meta_prose
    rules: [PROSE-001, PROSE-004, AI-002]
    input_text: '因此需要分别明确三个问题的关系，下面分别进行讨论。'
    undesirable_patterns: ['因此需要分别明确', '下面分别进行讨论']
    required_outcomes: [direct_problem_relation, no_unprovided_motivation]

  - id: normal_positive_independent_interfaces
    class: normal
    task: rewrite_negative_interface_audit
    rules: [AI-002, PROSE-001, STRUCT-001]
    input_text: '问题三不使用问题一结果，也不调用问题二结果，不为问题二提供参数。'
    undesirable_patterns: ['不使用问题一结果', '不调用问题二结果', '不为问题二提供参数']
    required_outcomes: [positive_input_output_relation, independent_purpose]

  - id: normal_pending_solve_to_objective
    class: normal
    task: replace_pending_solve_status
    rules: [AI-001, PROSE-001, STRUCT-001]
    input_text: '当前尚未完成实际求解，最终启用集合仍待计算。'
    undesirable_patterns: ['尚未完成实际求解', '仍待计算']
    required_outcomes: [pending_model_output, no_work_status_meta_prose]

  - id: normal_paragraph_final_negative_scope
    class: normal
    task: transform_repeated_negative_endings
    rules: [ADW-002, ADW-003, CLAIM-006]
    protected_content: [负面结果, 验证层级, 条件依赖性]
    required_outcomes: [positive_evidence_boundary, negative_result_kept]

  - id: resistance_technical_terms
    class: resistance
    task: preserve_technical_terms
    rules: [TERM-001, TERM-004]
    protected_content: [机制, 稳健优化, 耦合, 拓扑, 动态]

  - id: resistance_necessary_limitation
    class: resistance
    task: preserve_real_limitation
    rules: [ADW-002, ADW-005]
    protected_content: [样本范围, 方法失效条件]

  - id: resistance_real_uncertainty
    class: resistance
    task: preserve_evidence_calibrated_uncertainty
    rules: [ADW-004, CLAIM-001]
    protected_content: [未控制季节因素, 不作因果解释]

  - id: resistance_negative_evidence
    class: resistance
    task: preserve_core_negative_result
    rules: [CLAIM-006, DEPTH-005]
    protected_content: [不占优指标, 真实权衡]

  - id: mutation_key_number
    class: mutation
    task: reject_key_number_change
    protected_kind: numbers

  - id: mutation_formula
    class: mutation
    task: reject_formula_change
    protected_kind: formulas

  - id: mutation_citation_key
    class: mutation
    task: reject_citation_key_change
    protected_kind: citations

  - id: mutation_label_ref
    class: mutation
    task: reject_label_or_ref_change
    protected_kind: labels_and_references

  - id: mutation_master_source
    class: mutation
    task: reject_parallel_master_source
    protected_kind: authoritative_source
