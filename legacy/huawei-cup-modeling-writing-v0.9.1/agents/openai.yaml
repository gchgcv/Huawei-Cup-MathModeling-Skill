interface:
  display_name: "华为杯数学建模（稳健审计版）"
  short_description: "以证据和一致性为核心，降低建模错误与模板化 AI 写作"
  default_prompt: "使用 $huawei-cup-modeling 按最小任务范围执行当前数学建模任务。先判断 fresh 或 handoff；若已有题意拆解、模型、代码、结果或论文，继承可用成果并只做进入下一步所需的最小桥接检查，不机械从头重做。先核对事实与统一台账，不得编造数据、结果、文献或运行过程。涉及论文文件时先确定唯一主编辑源和模板来源，已有可编辑主稿时继续原稿，skill 内置 LaTeX 只能作为非官方工作稿；涉及论文正文时执行正文语言契约，减少模板化 AI 表达但保留准确专业术语；LaTeX 形成候选 PDF 后必须检查编译日志并渲染全部页面，复核图表浮动、异常空白、裁切和图文邻接；论文图不得用纯文字箭头链套框充当图；代码正式出图要实际打开/渲染检查，不能只看代码；完整论文参考文献必须真实、相关，旧题训练不得把官方答案或范文列为正式参考文献；建模推导和核心结果讨论应写到足以复核。涉及终稿时完成 P0、八项硬门控和 submission-audit 后才可标记 READY_TO_SUBMIT。"

policy:
  allow_implicit_invocation: true
